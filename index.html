<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Make Progress">

<title>Make Progress</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
  :root {
    --text-main: #1A201C;
    --text-muted: #6B7B72;
    --btn-bg: #3F574A; 
    --border-color: #B5C2BB; 
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background-color: #ffffff;
    -webkit-font-smoothing: antialiased;
  }

  /* Fundo com as folhas botânicas escuras */
  .bg-leaves {
    position: absolute;
    inset: 0;
    background: url('https://images.unsplash.com/photo-1542332606-bbf9304323fc?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
    z-index: 1;
    filter: brightness(0.9);
  }

  /* Camada SVG para o efeito Paper-cut 3D com corte diagonal orgânico */
  .paper-cut-layer {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 2;
    pointer-events: none;
  }

  svg.paper-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Container principal centralizado */
  .main-wrapper {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 380px;
    padding: 24px;
    display: flex;
    justify-content: center;
  }

  /* Cartão de vidro fosco (Glassmorphism) com micro-flutuação */
  .glass-card {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1.5px solid rgba(255, 255, 255, 0.95);
    border-radius: 40px;
    padding: 48px 32px 40px 32px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 
      0 35px 70px rgba(0, 0, 0, 0.16), 
      inset 0 4px 20px rgba(255, 255, 255, 0.85);
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both, floatCard 6s ease-in-out infinite 1s;
  }

  /* Ícone com micro-movimentação de respiração */
  .app-icon-container {
    position: relative;
    width: 84px;
    height: 84px;
    margin-bottom: 24px;
    border-radius: 22px;
    background: #1A201C;
    box-shadow: 0 12px 30px rgba(63, 87, 74, 0.35);
    animation: iconBreath 4s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .app-icon-container::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 22px;
    box-shadow: inset 0 2px 10px rgba(255,255,255,0.25), inset 0 -2px 6px rgba(0,0,0,0.4);
    pointer-events: none;
    z-index: 2;
  }

  .app-icon-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 22px;
    display: block;
  }

  /* Fallback SVG refinado caso a imagem local não seja encontrada no preview */
  .app-icon-fallback {
    display: none;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
    background: #1A201C;
    color: #7CAF7A;
  }

  .title {
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: -0.03em;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-bottom: 36px;
    font-weight: 500;
  }

  /* Caixa de Status simulando um campo de input elegante */
  .status-input-pill {
    width: 100%;
    border: 1px solid var(--border-color);
    background: rgba(255, 255, 255, 0.4);
    border-radius: 24px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
  }

  .status-text {
    font-size: 0.85rem;
    color: var(--text-main);
    font-weight: 600;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border-color);
    border-top-color: var(--btn-bg);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  /* Botão verde escuro premium */
  .btn-primary {
    display: none;
    width: 100%;
    background: var(--btn-bg);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.95rem;
    text-align: center;
    padding: 16px;
    border-radius: 24px;
    text-decoration: none;
    box-shadow: 0 10px 24px rgba(63, 87, 74, 0.35);
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px rgba(63, 87, 74, 0.45);
  }

  @keyframes fadeUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes floatCard {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes iconBreath {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="bg-leaves"></div>

<!-- Efeito Paper-Cut 3D com corte diagonal acentuado e sombras profundas -->
<div class="paper-cut-layer">
  <svg class="paper-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="shadow-deep" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="15" dy="25" stdDeviation="18" flood-color="#020804" flood-opacity="0.85"/>
      </filter>
      <filter id="shadow-mid" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="10" dy="15" stdDeviation="12" flood-color="#020804" flood-opacity="0.65"/>
      </filter>
      <filter id="shadow-light" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="5" dy="8" stdDeviation="8" flood-color="#020804" flood-opacity="0.4"/>
      </filter>
    </defs>

    <path d="M-100,-100 L1100,-200 C1100,-200 900,400 650,650 C400,900 -200,1100 -200,1100 L-100,1100 Z" fill="#d4ded7" filter="url(#shadow-deep)"/>
    <path d="M-100,-100 L1000,-150 C1000,-150 820,350 580,590 C340,830 -150,1050 -150,1050 L-100,1100 Z" fill="#ebf0ed" filter="url(#shadow-mid)"/>
    <path d="M-100,-100 L880,-100 C880,-100 740,300 500,540 C260,780 -100,1000 -100,1000 Z" fill="#ffffff" filter="url(#shadow-light)"/>
  </svg>
</div>

<!-- Interface do Aplicativo -->
<main class="main-wrapper">
  <div class="glass-card">
    
    <!-- Ícone com tratamento aprimorado e fallback automático se o arquivo local não carregar -->
    <div class="app-icon-container">
      <img id="appIconImg" src="icon-192.png" alt="App Logo" onerror="handleImageError()">
      <div id="appIconFallback" class="app-icon-fallback">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
          <polyline points="17 6 23 6 23 12"></polyline>
        </svg>
      </div>
    </div>

    <h1 class="title">Make Progress</h1>
    <p class="subtitle">Faça acontecer.</p>

    <div class="status-input-pill">
      <span class="status-text" id="statusMsg">Autenticando...</span>
      <div class="spinner" id="spinner"></div>
    </div>

    <a id="btnOpen" class="btn-primary" href="#" target="_top">Acessar App</a>

  </div>
</main>

<script>
// Tratamento de erro robusto para exibir o ícone vetorial caso o arquivo png não exista no ambiente de teste
function handleImageError() {
  document.getElementById('appIconImg').style.display = 'none';
  document.getElementById('appIconFallback').style.display = 'flex';
}

// ══════════════════════════════════════════════
// CONFIGURAÇÃO — URL do Web App GAS
// ══════════════════════════════════════════════
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwhTyTUDr0EqPrGKsy8ymV7un7YqZYrG9vQLxv60RUppn9H9E-H4HiBF1Nu2M1S9U8T/exec';

(function() {
  const btn = document.getElementById('btnOpen');
  const msg = document.getElementById('statusMsg');
  const spinner = document.getElementById('spinner');

  btn.href = GAS_URL;

  const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  function executeRedirect() {
    try {
      window.location.replace(GAS_URL);
    } catch(e) {
      window.location.href = GAS_URL;
    }
  }

  if (GAS_URL.includes('COLE_AQUI')) {
    spinner.style.display = 'none';
    msg.textContent = 'App não configurado.';
    msg.style.color = '#D97706';
    btn.textContent = 'Configurar agora';
    btn.style.display = 'block';
    return;
  }

  setTimeout(() => {
    spinner.style.display = 'none';
    
    if (!isPWA) {
      msg.textContent = 'Adicione à tela inicial';
    } else {
      msg.textContent = 'Ambiente verificado';
    }

    btn.style.display = 'block';
    
    let seconds = 4;
    const updateButtonText = () => {
      btn.textContent = `Acessar App (${seconds}s)`;
    };
    
    updateButtonText();
    
    const countdown = setInterval(() => {
      seconds--;
      if (seconds > 0) {
        updateButtonText();
      } else {
        clearInterval(countdown);
        btn.textContent = 'Redirecionando...';
        btn.style.opacity = '0.7';
        btn.style.pointerEvents = 'none';
        executeRedirect();
      }
    }, 1000);
    
  }, 1200);
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
