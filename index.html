<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Make Progress">

<title>Make Progress</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.jpg">
<link rel="icon" type="image/jpg" sizes="192x192" href="icon-192.jpg">

<style>
  :root {
    --text-main: #18211D;
    --text-muted: #66756D;
    --accent: #3997BE;
    --accent-2: #58B7A2;
    --btn-bg: #183F4D;
    --border: rgba(255,255,255,.72);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 100%; min-height: 100%; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background:
      radial-gradient(circle at 18% 18%, rgba(88,183,162,.20), transparent 30%),
      radial-gradient(circle at 82% 78%, rgba(57,151,190,.18), transparent 34%),
      linear-gradient(135deg, #eef6f2 0%, #f8fbfa 48%, #edf6fa 100%);
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
  }

  /* Fundo orgânico, agora mais leve e coerente com o visual atual do Make Progress */
  .bg-leaves {
    position: absolute;
    inset: -8%;
    background: url('https://images.unsplash.com/photo-1542332606-bbf9304323fc?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
    z-index: 1;
    opacity: .20;
    filter: saturate(.75) brightness(1.08);
    transform: scale(1.04);
  }

  .bg-glow {
    position: absolute;
    width: 42vw;
    height: 42vw;
    min-width: 280px;
    min-height: 280px;
    max-width: 620px;
    max-height: 620px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.78) 0%, rgba(255,255,255,0) 70%);
    z-index: 2;
    pointer-events: none;
    filter: blur(4px);
  }

  /* Camadas de profundidade */
  .paper-cut-layer {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 3;
    pointer-events: none;
  }

  svg.paper-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .main-wrapper {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 400px;
    padding: 24px;
    display: flex;
    justify-content: center;
  }

  /* Superfície premium — mais leve, orgânica e sem aparência de borda pesada */
  .glass-card {
    position: relative;
    background:
      linear-gradient(145deg, rgba(255,255,255,.80), rgba(255,255,255,.57));
    backdrop-filter: blur(30px) saturate(125%);
    -webkit-backdrop-filter: blur(30px) saturate(125%);
    border: 1px solid var(--border);
    border-radius: 38px 38px 48px 30px;
    padding: 42px 32px 34px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow:
      0 34px 80px rgba(24,63,77,.16),
      0 8px 26px rgba(24,63,77,.08),
      inset 0 1px 0 rgba(255,255,255,.95),
      inset 0 -1px 0 rgba(255,255,255,.28);
    animation:
      fadeUp .8s cubic-bezier(.16,1,.3,1) .15s both,
      floatCard 7s ease-in-out 1s infinite;
  }

  .glass-card::before {
    content: '';
    position: absolute;
    width: 150px;
    height: 150px;
    top: -70px;
    right: -60px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(88,183,162,.22), transparent 68%);
    pointer-events: none;
  }

  /* Ícone oficial do aplicativo */
  .app-icon-container {
    position: relative;
    width: 96px;
    height: 96px;
    margin-bottom: 22px;
    border-radius: 27px;
    overflow: hidden;
    flex: 0 0 auto;
    background: transparent;
    box-shadow:
      0 18px 38px rgba(37,105,128,.20),
      0 5px 14px rgba(37,105,128,.10);
    animation: iconBreath 4.5s ease-in-out infinite;
  }

  .app-icon-container::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.52),
      inset 0 -2px 8px rgba(0,0,0,.10);
    pointer-events: none;
    z-index: 2;
  }

  .app-icon-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: inherit;
    display: block;
  }

  .title {
    font-size: 1.72rem;
    line-height: 1.15;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: -.035em;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: .9rem;
    color: var(--text-muted);
    margin-bottom: 30px;
    font-weight: 500;
    letter-spacing: -.01em;
  }

  .status-input-pill {
    width: 100%;
    border: 1px solid rgba(117,145,135,.22);
    background: rgba(255,255,255,.46);
    border-radius: 22px;
    padding: 13px 17px 13px 19px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    box-shadow:
      inset 0 1px 3px rgba(24,63,77,.035),
      0 5px 16px rgba(24,63,77,.035);
  }

  .status-text {
    font-size: .82rem;
    color: var(--text-main);
    font-weight: 600;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(57,151,190,.20);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    flex: 0 0 auto;
  }

  .btn-primary {
    display: none;
    width: 100%;
    background: linear-gradient(135deg, #183F4D 0%, #225B68 100%);
    color: #fff;
    font-weight: 600;
    font-size: .94rem;
    text-align: center;
    padding: 15px 16px;
    border-radius: 21px;
    text-decoration: none;
    box-shadow: 0 12px 26px rgba(24,63,77,.24);
    transition: transform .25s ease, box-shadow .25s ease, opacity .25s ease;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 32px rgba(24,63,77,.30);
  }

  .btn-primary:active {
    transform: translateY(0);
  }

  @keyframes fadeUp {
    from { transform: translateY(30px) scale(.985); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  @keyframes floatCard {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  @keyframes iconBreath {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.025); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 520px) {
    .main-wrapper { max-width: 390px; padding: 18px; }

    .glass-card {
      border-radius: 32px 32px 42px 26px;
      padding: 34px 24px 28px;
    }

    .app-icon-container {
      width: 88px;
      height: 88px;
      border-radius: 25px;
      margin-bottom: 20px;
    }

    .title { font-size: 1.58rem; }
    .subtitle { margin-bottom: 25px; }

    .paper-cut-layer { opacity: .72; }
  }

  @media (prefers-reduced-motion: reduce) {
    .glass-card,
    .app-icon-container,
    .spinner {
      animation: none !important;
    }
  }
</style>
</head>
<body>

<div class="bg-leaves"></div>
<div class="bg-glow"></div>

<div class="paper-cut-layer">
  <svg class="paper-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="shadow-deep" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="15" dy="25" stdDeviation="18" flood-color="#16332b" flood-opacity=".30"/>
      </filter>
      <filter id="shadow-mid" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="10" dy="15" stdDeviation="12" flood-color="#16332b" flood-opacity=".22"/>
      </filter>
      <filter id="shadow-light" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="5" dy="8" stdDeviation="8" flood-color="#16332b" flood-opacity=".14"/>
      </filter>
    </defs>

    <path d="M-100,-100 L1100,-200 C1100,-200 900,400 650,650 C400,900 -200,1100 -200,1100 L-100,1100 Z"
          fill="#d4e3dc" filter="url(#shadow-deep)"/>
    <path d="M-100,-100 L1000,-150 C1000,-150 820,350 580,590 C340,830 -150,1050 -150,1050 L-100,1100 Z"
          fill="#eaf2ee" filter="url(#shadow-mid)"/>
    <path d="M-100,-100 L880,-100 C880,-100 740,300 500,540 C260,780 -100,1000 -100,1000 Z"
          fill="#ffffff" filter="url(#shadow-light)"/>
  </svg>
</div>

<main class="main-wrapper">
  <div class="glass-card">

    <!-- Ícone oficial 192x192 do Make Progress -->
    <div class="app-icon-container">
      <img
        id="appIconImg"
        src="icon-192.jpg"
        alt="Make Progress"
        width="192"
        height="192"
        fetchpriority="high"
        decoding="async"
      >
    </div>

    <h1 class="title">Make Progress</h1>
    <p class="subtitle">Faça acontecer.</p>

    <div class="status-input-pill">
      <span class="status-text" id="statusMsg">Autenticando...</span>
      <div class="spinner" id="spinner" aria-hidden="true"></div>
    </div>

    <a id="btnOpen" class="btn-primary" href="#" target="_top">Acessar App</a>

  </div>
</main>

<script>
// ══════════════════════════════════════════════
// CONFIGURAÇÃO — URL do Web App GAS
// ══════════════════════════════════════════════
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwhTyTUDr0EqPrGKsy8ymV7un7YqZYrG9vQLxv60RUppn9H9E-H4HiBF1Nu2M1S9U8T/exec';

(function() {
  const btn = document.getElementById('btnOpen');
  const msg = document.getElementById('statusMsg');
  const spinner = document.getElementById('spinner');

  btn.href = GAS_URL;

  const isPWA =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  function executeRedirect() {
    try {
      window.location.replace(GAS_URL);
    } catch(e) {
      window.location.href = GAS_URL;
    }
  }

  if (GAS_URL.includes('COLE_AQUI')) {
    spinner.style.display = 'none';
    msg.textContent = 'App não configurado.';
    msg.style.color = '#D97706';
    btn.textContent = 'Configurar agora';
    btn.style.display = 'block';
    return;
  }

  setTimeout(() => {
    spinner.style.display = 'none';

    if (!isPWA) {
      msg.textContent = 'Adicione à tela inicial';
    } else {
      msg.textContent = 'Ambiente verificado';
    }

    btn.style.display = 'block';

    let seconds = 4;

    const updateButtonText = () => {
      btn.textContent = `Acessar App (${seconds}s)`;
    };

    updateButtonText();

    const countdown = setInterval(() => {
      seconds--;

      if (seconds > 0) {
        updateButtonText();
      } else {
        clearInterval(countdown);
        btn.textContent = 'Redirecionando...';
        btn.style.opacity = '0.7';
        btn.style.pointerEvents = 'none';
        executeRedirect();
      }
    }, 1000);

  }, 1200);
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
